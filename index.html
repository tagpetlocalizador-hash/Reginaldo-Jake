<script>


// =================================
// LINK APPS SCRIPT
// =================================


const urlAppScript =

"https://script.google.com/macros/s/AKfycbzXKlxXJPCS_LBcAEzos6Gdl9yPvqnHpyOZytXP1IDZhpYvpUJTRVSQjhzgNMJPgN7k/exec";




// =================================
// BUSCAR DADOS DO PET
// =================================


fetch(urlAppScript + "?acao=dados")


.then(resposta => resposta.json())


.then(dados => {


document.getElementById("nomePet").innerHTML =
"🐾 " + dados.nome;


document.getElementById("tutor").innerHTML =
dados.tutor;


document.getElementById("telefone").innerHTML =
dados.telefone;



let telefone =
dados.telefone.replace(/\D/g,'');



document.getElementById("btnLigar").href =
"tel:+55" + telefone;



document.getElementById("btnWhats").href =
"https://wa.me/55" + telefone;



})


.catch(erro => {


console.log("Erro dados:", erro);


document.getElementById("nomePet").innerHTML =
"Erro ao carregar pet";


});






// =================================
// LOCALIZAÇÃO COM ERRO DETALHADO
// =================================


if(navigator.geolocation){



navigator.geolocation.getCurrentPosition(



function(posicao){



let latitude =
posicao.coords.latitude;


let longitude =
posicao.coords.longitude;



console.log("Latitude:", latitude);

console.log("Longitude:", longitude);




fetch(

urlAppScript +

"?lat=" +

latitude +

"&lon=" +

longitude

)



.then(resposta => resposta.text())


.then(resultado => {


console.log("Resposta servidor:", resultado);



document.getElementById("status").innerHTML =

"✅ Localização enviada";


})



.catch(erro => {


console.log("Erro envio:", erro);


document.getElementById("status").innerHTML =

"❌ Erro ao enviar localização";


});



},




function(erro){



console.log("Erro GPS:", erro);



document.getElementById("status").innerHTML =


"⚠️ Erro GPS: " + erro.message;



}



);



}

else{


document.getElementById("status").innerHTML =

"❌ Este navegador não suporta localização";


}



</script>
